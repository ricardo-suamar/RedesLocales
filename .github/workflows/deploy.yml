name: Deploy Documentation

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material pymdown-extensions ghp-import
          npm install -g staticrypt

      # 5. Compilar la web con MkDocs
      - name: Build site with MkDocs
        run: mkdocs build -d site

      # 6. Cifrar HTMLs forzando la salida a la misma carpeta
      - name: Encrypt HTML files
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITIO_PASSWORD }}
        run: |
          find site -type f -name "*.html" | while read file; do
            echo "Procesando $file..."
            staticrypt "$file" -p "$STATICRYPT_PASSWORD" -o "$file" --overwrite
          done

      # 7. INSPECCIÓN: Verificar en el log si el archivo se cifró realmente
      - name: Inspect generated index.html
        run: |
          echo "=== INICIO DE INDEX.HTML ==="
          head -n 20 site/index.html
          echo "=== FIN DE INDEX.HTML ==="

      # 8. Evitar que GitHub procese la web con Jekyll
      - name: Prevent Jekyll build
        run: touch site/.nojekyll

      # 9. Configurar bot de Git
      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 10. Publicar la carpeta 'site' cifrada a gh-pages
      - name: Deploy encrypted site
        run: |
          ghp-import -n -p -f site