name: Deploy Documentation

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material pymdown-extensions ghp-import
          npm install staticrypt

      # 5. Compilar la web con MkDocs
      - name: Build site with MkDocs
        run: mkdocs build -d site

      # 6. Cifrar los HTML mediante un script Node.js infalible
      - name: Encrypt HTML files
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITIO_PASSWORD }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          function getHtmlFiles(dir) {
            let results = [];
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              file = path.join(dir, file);
              const stat = fs.statSync(file);
              if (stat && stat.isDirectory()) {
                results = results.concat(getHtmlFiles(file));
              } else if (file.endsWith(".html")) {
                results.push(file);
              }
            });
            return results;
          }

          const files = getHtmlFiles("site");
          const password = process.env.STATICRYPT_PASSWORD;

          if (!password) {
            console.error("ERROR CRÍTICO: La contraseña SITIO_PASSWORD está vacía en secretos.");
            process.exit(1);
          }

          files.forEach(file => {
            console.log("Cifrando:", file);
            execSync(`npx staticrypt "${file}" -p "${password}" -o "${file}" --overwrite`);
          });
          '

      # 7. INSPECCIÓN: Verificar que index.html cambió
      - name: Inspect generated index.html
        run: |
          echo "=== INICIO DE INDEX.HTML ==="
          head -n 20 site/index.html
          echo "=== FIN DE INDEX.HTML ==="

      # 8. Evitar que GitHub procese la web con Jekyll
      - name: Prevent Jekyll build
        run: touch site/.nojekyll

      # 9. Configurar bot de Git
      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 10. Publicar la carpeta 'site' cifrada a gh-pages
      - name: Deploy encrypted site
        run: |
          ghp-import -n -p -f site