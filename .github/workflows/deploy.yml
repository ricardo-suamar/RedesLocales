name: Deploy Documentation

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. Sistema de caché de MkDocs
      - name: Cache MkDocs dependencies
        run: echo "cache_id=$(date --utc +'%Y%V')" >> $GITHUB_ENV

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      # 5. Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material pymdown-extensions ghp-import
          npm install -g staticrypt

      # 6. Compilar la web con MkDocs en la carpeta 'site'
      - name: Build site with MkDocs
        run: mkdocs build -d site

      # 7. Cifrar todos los archivos HTML a la carpeta 'encrypted_site' (Usando -o)
      - name: Encrypt HTML files
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITIO_PASSWORD }}
        run: |
          staticrypt site -r -o encrypted_site -p "$STATICRYPT_PASSWORD" --remember 30 --short

      # 8. Copiar archivos estáticos (CSS, JS, imágenes) a la carpeta cifrada
      - name: Copy static non-HTML assets
        run: |
          rsync -av --exclude='*.html' site/ encrypted_site/

      # 9. Configurar bot de Git
      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 10. Publicar la carpeta 'encrypted_site' a la rama gh-pages
      - name: Deploy encrypted site
        run: |
          ghp-import -n -p -f encrypted_site