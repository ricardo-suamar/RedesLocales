name: Deploy Documentation

on:
  push:
    branches:
      - main  # Cambia a 'master' si tu rama principal se llama así

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Instalar MkDocs y todas las extensiones avanzadas
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material pymdown-extensions ghp-import

      # 4. Configurar bot de Git para el commit de despliegue
      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 5. Compilar y Desplegar en la rama gh-pages automáticamente
      - name: Deploy to GitHub Pages
        run: |
          mkdocs gh-deploy --force