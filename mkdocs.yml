site_name: Mis Apuntes de Clase
site_description: Material de estudio y apuntes para los alumnos

theme:
  name: material
  palette:
    # Modo Claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    # Modo Oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.tabs          # Muestra los temas en una barra superior estilo pestañas
    - navigation.tabs.sticky   # Mantiene las pestañas visibles al hacer scroll
    - navigation.top           # Añade botón "Volver arriba" al hacer scroll
    - navigation.sections      # Agrupa apartados de forma limpia
    - search.suggest           # Búsqueda con sugerencias automáticas
    - search.highlight         # Resalta las palabras buscadas
    - content.code.copy        # Botón para copiar bloques de código

nav:
  - Inicio: index.md
  - Tema 1 - Introducción: tema1.md
